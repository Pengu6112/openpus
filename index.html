<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clips</title>
<style>
  :root { --bg:#0b0c0f; --card:#14161b; --line:#23262e; --txt:#e8eaf0; --dim:#8b90a0; --acc:#6c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { padding:22px 32px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  h1 { font-size:17px; margin:0; letter-spacing:.2px; }
  header span { color:var(--dim); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:28px 24px 80px; }

  #drop { border:1.5px dashed var(--line); border-radius:14px; padding:44px 24px; text-align:center;
          cursor:pointer; transition:.15s; background:var(--card); }
  #drop:hover, #drop.over { border-color:var(--acc); background:#161a24; }
  #drop b { display:block; font-size:16px; margin-bottom:6px; }
  #drop small { color:var(--dim); }
  #bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin-top:16px; display:none; }
  #bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }

  .job { border:1px solid var(--line); border-radius:12px; background:var(--card);
         padding:16px 18px; margin-top:22px; }
  .job h2 { font-size:14px; margin:0; font-weight:600; }
  .job .st { color:var(--dim); font-size:13px; margin-top:3px; }
  .job.err .st { color:#ff7a7a; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
       margin:26px 0 10px; font-weight:600; }
  .lib { border:1px solid var(--line); border-radius:12px; background:var(--card); overflow:hidden; }
  .lib .row { display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line); }
  .lib .row:first-child { border-top:0; }
  .lib .row:hover { background:#171a21; }
  .lib .nm { flex:1; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib .mt { color:var(--dim); font-size:12px; white-space:nowrap; }
  .lib button { background:#20304f; color:#cfd9ff; border:1px solid #2d4a7a; border-radius:7px;
                padding:5px 11px; font-size:12.5px; cursor:pointer; }
  .lib button:hover { background:#283d63; }
  .lib button:disabled { opacity:.45; cursor:default; }
  .clips { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
           gap:14px; margin-top:16px; }
  .clip { background:#0f1116; border:1px solid var(--line); border-radius:10px; overflow:hidden;
          position:relative; }
  .clip video { width:100%; display:block; aspect-ratio:9/16; background:#000; }
  .clip div { padding:9px 11px; }
  .clip p { margin:0; font-size:13px; }
  .clip small { color:var(--dim); font-size:11.5px; }
  .clip a { display:block; margin-top:8px; color:var(--acc); font-size:12.5px; text-decoration:none; }
  .clip a:hover { text-decoration:underline; }
  .clip .x { position:absolute; top:8px; right:8px; width:26px; height:26px; padding:0;
             border-radius:50%; border:1px solid #3a3f4b; background:#000a; color:#fff;
             font-size:14px; line-height:1; cursor:pointer; opacity:.75; }
  .clip .x:hover { opacity:1; background:#7a2230; border-color:#a8364a; }
  .job .kill { float:right; background:none; border:1px solid var(--line); color:var(--dim);
               border-radius:7px; padding:3px 9px; font-size:12px; cursor:pointer; }
  .job .kill:hover { color:#ff9a9a; border-color:#7a2230; }
</style>
</head>
<body>
<header><h1>Clips</h1><span>long video &rarr; vertical shorts &middot; EN + PT captions &middot; new recordings are queued automatically</span></header>
<main>
  <div id="drop">
    <b>Drop a video here</b>
    <small>or click to choose &middot; mp4, mov, mkv, webm &middot; 2 min to 2 h</small>
    <input type="file" id="file" accept="video/*" hidden>
  </div>
  <div id="bar"><i></i></div>

  <h3>Recordings from Capture Panel</h3>
  <div class="lib" id="lib"><div class="row"><span class="mt">loading…</span></div></div>

  <h3>Clips</h3>
  <div id="jobs"></div>
</main>
<script>
const drop = document.getElementById('drop'), input = document.getElementById('file');
const bar = document.getElementById('bar'), fill = bar.firstElementChild;
let polling = null;

drop.onclick = () => input.click();
input.onchange = () => input.files[0] && upload(input.files[0]);
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) upload(f); });

function upload(file) {
  bar.style.display = 'block';
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/clip');
  xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
  xhr.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%'; };
  xhr.onload = () => {
    fill.style.width = '100%';
    setTimeout(() => { bar.style.display = 'none'; fill.style.width = '0'; }, 600);
    if (xhr.status !== 200) alert('Upload failed: ' + xhr.responseText);
    else { poll(); startPolling(); }
  };
  xhr.onerror = () => alert('Upload failed');
  xhr.send(file);
}

function startPolling() {
  if (polling) return;
  polling = setInterval(async () => {
    const jobs = await poll();
    if (jobs.every(j => j.status === 'done' || j.status === 'error')) {
      clearInterval(polling); polling = null;
    }
  }, 2000);
}

async function poll() {
  const jobs = await (await fetch('/api/jobs')).json();
  render(jobs);
  return jobs;
}

async function loadLibrary() {
  const lib = await (await fetch('/api/library')).json();
  const box = document.getElementById('lib');
  if (!lib.length) {
    box.innerHTML = '<div class="row"><span class="mt">no .mp4 in the capture folders</span></div>';
    return;
  }
  box.innerHTML = lib.map(f => `
    <div class="row">
      <span class="nm">${esc(f.name)}</span>
      <span class="mt">${f.duration ? Math.round(f.duration / 60) + ' min' : '?'} &middot; ${f.gb} GB</span>
      <button data-id="${esc(f.id)}">Clip it</button>
    </div>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => clipFile(b));
}

async function clipFile(btn) {
  btn.disabled = true;
  btn.textContent = 'queued';
  const r = await fetch('/api/library/clip', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: btn.dataset.id })
  });
  if (!r.ok) { btn.disabled = false; btn.textContent = 'Clip it'; alert('Failed: ' + await r.text()); }
  await poll();
  startPolling();
}

function render(jobs) {
  document.getElementById('jobs').innerHTML = jobs.map(j => {
    const clips = j.clips || [];
    const canRemove = j.status === 'done' || j.status === 'error';
    return `
    <section class="job ${j.status === 'error' ? 'err' : ''}">
      ${canRemove && !clips.length
        ? `<button class="kill" data-del="job" data-job="${j.id}">Remove</button>` : ''}
      <h2>${esc(j.name)}</h2>
      <div class="st">${esc(j.stage || j.status)}</div>
      ${clips.length ? `<div class="clips">${clips.map(c => `
        <article class="clip">
          <button class="x" data-del="clip" data-job="${j.id}" data-file="${esc(c.file)}"
                  title="delete this clip">&times;</button>
          <video src="/media/${j.id}/${c.file}" controls preload="metadata"></video>
          <div>
            <p>${esc(c.title)}</p>
            <small>${c.start}s &ndash; ${c.end}s &middot; ${esc(c.why)}</small>
            <a href="/media/${j.id}/${c.file}" download>Download mp4</a>
          </div>
        </article>`).join('')}</div>` : ''}
    </section>`;
  }).join('');
}

async function delClip(job, file) {
  if (!confirm('Delete this clip?')) return;
  const r = await fetch(`/api/jobs/${job}/clips/${encodeURIComponent(file)}`, { method: 'DELETE' });
  if (!r.ok) alert('Delete failed: ' + await r.text());
  await poll();
}

async function delJob(job) {
  if (!confirm('Delete this job and everything in it?')) return;
  const r = await fetch(`/api/jobs/${job}`, { method: 'DELETE' });
  if (!r.ok) alert('Delete failed: ' + await r.text());
  await poll();
}

document.getElementById('jobs').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-del]');
  if (!b) return;
  b.dataset.del === 'clip' ? delClip(b.dataset.job, b.dataset.file) : delJob(b.dataset.job);
});

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
loadLibrary();
poll().then(jobs => { if (jobs.some(j => j.status !== 'done' && j.status !== 'error')) startPolling(); });
</script>
</body>
</html>
